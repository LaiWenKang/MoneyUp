name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  CI_XCODE_VERSION: "16.4"
  CI_XCODE_BUILD: 16F6
  CI_IPHONESIMULATOR_SDK_VERSION: "18.5"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce Swift structure limits
        run: python3 Scripts/validate_swift_structure.py
      - name: Validate privacy, localization, icons, and launch docs
        run: python3 Scripts/validate_release_assets.py

  core-tests:
    name: Core tests
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the exact CI Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          XCODE_VERSION_LINE="$(xcodebuild -version | sed -n '1p')"
          XCODE_BUILD_LINE="$(xcodebuild -version | sed -n '2p')"
          if [[ "$XCODE_VERSION_LINE" != "Xcode $CI_XCODE_VERSION" || \
                "$XCODE_BUILD_LINE" != "Build version $CI_XCODE_BUILD" ]]; then
            echo "::error::The runner does not contain the reviewed CI Xcode toolchain."
            exit 1
          fi
          printf '%s\n' "$XCODE_VERSION_LINE" "$XCODE_BUILD_LINE"
          swift --version
      - name: Run domain tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --parallel --enable-code-coverage -Xswiftc -warnings-as-errors \
            2>&1 | tee core-tests.log
      - name: Report domain coverage
        shell: bash
        run: |
          set -euo pipefail
          COVERAGE_PATH="$(swift test --show-codecov-path)"
          test -s "$COVERAGE_PATH"
          cp "$COVERAGE_PATH" core-persistence-coverage.json
          python3 - "$COVERAGE_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              payload = json.load(source)
          totals = payload["data"][0]["totals"]
          for name in ("lines", "functions", "regions", "branches"):
              metric = totals.get(name)
              if metric:
                  print(
                      f"{name}: {metric['covered']}/{metric['count']} "
                      f"({metric['percent']:.2f}%)"
                  )
          PY
      - name: Preserve domain test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-persistence-test-evidence
          path: |
            core-tests.log
            core-persistence-coverage.json
          if-no-files-found: warn
          retention-days: 14

  ios-build:
    name: iOS Simulator build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the exact CI Xcode and simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          XCODE_VERSION_LINE="$(xcodebuild -version | sed -n '1p')"
          XCODE_BUILD_LINE="$(xcodebuild -version | sed -n '2p')"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if [[ "$XCODE_VERSION_LINE" != "Xcode $CI_XCODE_VERSION" || \
                "$XCODE_BUILD_LINE" != "Build version $CI_XCODE_BUILD" || \
                "$SDK_VERSION" != "$CI_IPHONESIMULATOR_SDK_VERSION" ]]; then
            echo "::error::The runner does not contain the reviewed CI Xcode and simulator SDK."
            exit 1
          fi
          printf '%s\n' "$XCODE_VERSION_LINE" "$XCODE_BUILD_LINE" \
            "iPhoneSimulator SDK $SDK_VERSION"
      - name: Install checksum-verified XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: >-
          xcodebuild
          -project MoneyUp.xcodeproj
          -scheme MoneyUp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run app model tests
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))'
          )"
          test -n "$SIMULATOR_ID"
          RESULT_BUNDLE="$RUNNER_TEMP/MoneyUpTests.xcresult"
          xcodebuild \
            -project MoneyUp.xcodeproj \
            -scheme MoneyUp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcrun xccov view --report "$RESULT_BUNDLE"
          xcrun xccov view --report --json "$RESULT_BUNDLE" \
            > app-model-coverage.json
      - name: Preserve app-model test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-model-test-evidence
          path: |
            app-model-coverage.json
            ${{ runner.temp }}/MoneyUpTests.xcresult
          if-no-files-found: warn
          retention-days: 14
