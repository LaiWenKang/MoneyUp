name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate privacy, localization, icons, and launch docs
        run: python3 Scripts/validate_release_assets.py

  core-tests:
    name: Core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run domain tests
        run: swift test --parallel -Xswiftc -warnings-as-errors

  ios-build:
    name: iOS Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: >-
          xcodebuild
          -project MoneyUp.xcodeproj
          -scheme MoneyUp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
