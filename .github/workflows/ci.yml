name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate privacy, localization, icons, and launch docs
        run: python3 Scripts/validate_release_assets.py

  core-tests:
    name: Core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run domain tests
        run: swift test --parallel -Xswiftc -warnings-as-errors

  ios-build:
    name: iOS Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: >-
          xcodebuild
          -project MoneyUp.xcodeproj
          -scheme MoneyUp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run app model tests
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))'
          )"
          test -n "$SIMULATOR_ID"
          xcodebuild \
            -project MoneyUp.xcodeproj \
            -scheme MoneyUp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
