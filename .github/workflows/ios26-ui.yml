name: iOS 26 interaction review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full review or isolated original favourite test (diagnostic only)'
        type: choice
        required: true
        default: full
        options: [full, favourite]

permissions:
  contents: read

concurrency:
  group: ios26-ui-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

jobs:
  native-review:
    name: ${{ inputs.suite == 'favourite' && 'Favourite diagnostic (not full review)' || 'native-review' }}
    runs-on: macos-26
    # Includes the end-to-end journeys (MoneyUpJourneyTests), which need an
    # ad-hoc signature for the App Group the widget-route queue uses.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified XcodeGen
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare iOS 26 simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen generate
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIMULATOR_ID="$(python3 -c 'import json,os; data=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); print(next(d["udid"] for r,ds in sorted(data["devices"].items(),reverse=True) if ".iOS-26-" in r for d in ds if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run native render tests
        if: ${{ inputs.suite != 'favourite' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project MoneyUp.xcodeproj -scheme MoneyUp -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/MoneyUpUI26.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/MoneyUpUI26DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:MoneyUpTests/AppwideExperienceTests \
            -only-testing:MoneyUpTests/OverviewInsightTests \
            -only-testing:MoneyUpTests/SmartOverviewRenderTests \
            -only-testing:MoneyUpTests/AppwideRenderEvidenceTests \
            -only-testing:MoneyUpTests/Feedback1039RegressionTests \
            -only-testing:MoneyUpTests/AutomaticUnlockTests \
            -only-testing:MoneyUpTests/QuickLogKeyboardJourneyTests \
            -only-testing:MoneyUpTests/QuickLogBatchTests \
            -only-testing:MoneyUpTests/QuickLogFlowReliabilityTests \
            -only-testing:MoneyUpTests/BatchDeviceCoverageTests \
            -only-testing:MoneyUpTests/ScreenshotReceiptJourneyTests \
            -only-testing:MoneyUpTests/DailyJourneyAcceptanceTests \
            -only-testing:MoneyUpTests/TransactionPreparationTests \
            -only-testing:MoneyUpTests/JourneyRecalculationTests \
            -only-testing:MoneyUpTests/BudgetCheckpointAvailabilityTests \
            -only-testing:MoneyUpTests/BudgetResilienceTests \
            -only-testing:MoneyUpTests/BudgetPeriodRecoveryTests \
            -only-testing:MoneyUpTests/NavigationPresentationTests \
            -only-testing:MoneyUpTests/RedesignRenderEvidenceTests \
            -only-testing:MoneyUpTests/PlatformQuickLogActionTests \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/ui26-native.log"
      - name: Run UI journeys
        # The focused run has its own bound and cannot cancel a full review.
        timeout-minutes: ${{ inputs.suite == 'favourite' && 15 || 60 }}
        shell: bash
        env:
          REVIEW_SUITE: ${{ inputs.suite || 'full' }}
        run: |
          set -euo pipefail
          set --
          case "$REVIEW_SUITE" in
            full) ;;
            favourite) set -- -only-testing:MoneyUpUITests/MoneyUpJourneyTests/testSaveAsFavouriteFromTheSavedBanner ;;
            *) echo "Unknown review suite" >&2; exit 2 ;;
          esac
          printf 'Review suite: %s\n' "$REVIEW_SUITE" | tee "$RUNNER_TEMP/ui26-scope.txt"
          xcodebuild -project MoneyUp.xcodeproj -scheme MoneyUpColdLaunch -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/MoneyUpUI26DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MoneyUpColdLaunch.xcresult" \
            -parallel-testing-enabled NO \
            "$@" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee "$RUNNER_TEMP/ui26-journeys.log"
      - name: Export review evidence
        if: ${{ always() }}
        env:
          REVIEW_SUITE: ${{ inputs.suite || 'full' }}
        run: bash scripts/export_ios26_review.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: ${{ inputs.suite == 'favourite' && 'favourite-ios26-diagnostic' || 'native-ios26-review' }}
          path: |
            ${{ runner.temp }}/ui26-images
            ${{ runner.temp }}/ui26-summary.json
            ${{ runner.temp }}/ui26-cold-images
            ${{ runner.temp }}/ui26-cold-summary.json
            ${{ runner.temp }}/ui26-export-errors.log
            ${{ runner.temp }}/ui26-native.log
            ${{ runner.temp }}/ui26-journeys.log
            ${{ runner.temp }}/ui26-scope.txt
          retention-days: 14

