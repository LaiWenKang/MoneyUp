name: iOS 26 interaction review

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios26-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-review:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified XcodeGen
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Render and test on iOS 26
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen generate
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIMULATOR_ID="$(python3 -c 'import json,os; data=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); print(next(d["udid"] for r,ds in sorted(data["devices"].items(),reverse=True) if ".iOS-26-" in r for d in ds if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          xcodebuild -project MoneyUp.xcodeproj -scheme MoneyUp -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/MoneyUpUI26.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/MoneyUpUI26DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:MoneyUpTests/AppwideExperienceTests \
            -only-testing:MoneyUpTests/AppwideRenderEvidenceTests \
            -only-testing:MoneyUpTests/Feedback1039RegressionTests \
            -only-testing:MoneyUpTests/NavigationPresentationTests \
            -only-testing:MoneyUpTests/RedesignRenderEvidenceTests \
            -only-testing:MoneyUpTests/PlatformQuickLogActionTests \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO test
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/MoneyUpUI26DerivedData/Build/Products/Debug-iphonesimulator/MoneyUp.app"
          xcrun simctl terminate "$SIMULATOR_ID" com.laiwenkang.MoneyUp || true
          xcrun simctl openurl "$SIMULATOR_ID" moneyup://overview/today
          python3 - "$SIMULATOR_ID" <<'PYCODE'
          import subprocess, sys, time
          simulator = sys.argv[1]
          time.sleep(3)
          lines = subprocess.check_output(["xcrun", "simctl", "spawn", simulator, "launchctl", "list"], text=True).splitlines()
          live = [line for line in lines if "UIKitApplication:com.laiwenkang.MoneyUp[" in line and line.split()[0].isdigit()]
          if not live:
              raise SystemExit("MoneyUp did not remain running after the cold overview URL")
          print("Cold Smart Overview URL: app process remained alive on the clean simulator book")
          PYCODE
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/ui26-cold-overview.png"
      - name: Export review evidence
        if: ${{ always() }}
        run: |
          if test -d "$RUNNER_TEMP/MoneyUpUI26.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/MoneyUpUI26.xcresult" --output-path "$RUNNER_TEMP/ui26-images"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/MoneyUpUI26.xcresult" --compact > "$RUNNER_TEMP/ui26-summary.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: native-ios26-review
          path: |
            ${{ runner.temp }}/ui26-images
            ${{ runner.temp }}/ui26-summary.json
            ${{ runner.temp }}/ui26-cold-overview.png
          retention-days: 14
