name: MoneyUp

options:
  bundleIdPrefix: com.laiwenkang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.4.1

packages:
  MoneyUpPackage:
    path: .

targets:
  MoneyUp:
    type: application
    platform: iOS
    sources:
      - path: App/MoneyUp
    dependencies:
      - package: MoneyUpPackage
        product: MoneyUpCore
      - package: MoneyUpPackage
        product: MoneyUpPersistence
      - target: MoneyUpWidget
        embed: true
    info:
      path: App/MoneyUp/Info.plist
      properties:
        CFBundleDisplayName: MoneyUp
        CFBundleURLTypes:
          - CFBundleURLName: com.laiwenkang.MoneyUp
            CFBundleURLSchemes:
              - moneyup
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: Unlock your private MoneyUp financial data.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.laiwenkang.moneyup.archive
            UTTypeDescription: MoneyUp Encrypted Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - moneyup
              public.mime-type: application/vnd.moneyup.archive
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laiwenkang.MoneyUp
        PRODUCT_NAME: MoneyUp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MoneyUpTests

  MoneyUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MoneyUpAppTests
    dependencies:
      - target: MoneyUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laiwenkang.MoneyUpTests
        GENERATE_INFOPLIST_FILE: true

  MoneyUpWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/MoneyUpWidget
    info:
      path: App/MoneyUpWidget/Info.plist
      properties:
        CFBundleDisplayName: MoneyUp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laiwenkang.MoneyUp.Widget
        PRODUCT_NAME: MoneyUpWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
