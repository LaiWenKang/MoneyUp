name: MoneyUp

options:
  bundleIdPrefix: com.laiwenkang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  MoneyUpPackage:
    path: .

targets:
  MoneyUp:
    type: application
    platform: iOS
    sources:
      - path: App/MoneyUp
    dependencies:
      - package: MoneyUpPackage
        product: MoneyUpCore
      - package: MoneyUpPackage
        product: MoneyUpPersistence
      - target: MoneyUpWidget
        embed: true
    info:
      path: App/MoneyUp/Info.plist
      properties:
        CFBundleDisplayName: MoneyUp
        CFBundleURLTypes:
          - CFBundleURLName: com.laiwenkang.MoneyUp
            CFBundleURLSchemes:
              - moneyup
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: Unlock your private MoneyUp financial data.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laiwenkang.MoneyUp
        PRODUCT_NAME: MoneyUp
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []

  MoneyUpWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/MoneyUpWidget
    info:
      path: App/MoneyUpWidget/Info.plist
      properties:
        CFBundleDisplayName: MoneyUp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laiwenkang.MoneyUp.Widget
        PRODUCT_NAME: MoneyUpWidget
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
